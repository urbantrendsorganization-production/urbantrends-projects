[project]
name = "booknasi"
version = "0.1.0"
description = "Appointment booking with M-Pesa deposits, for Kenyan salons and barbershops."
requires-python = ">=3.12"
dependencies = [
    "django>=5.2",
    "djangorestframework>=3.15",
    "psycopg[binary]>=3.2",
    "celery>=5.4",
    "redis>=5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ", "C4"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.local"
python_files = ["test_*.py"]
addopts = "--strict-markers"
markers = [
    "loadbearing: tests that protect a decision, not an implementation. See core/tests/README.md.",
]

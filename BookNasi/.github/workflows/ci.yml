name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: booknasi
          POSTGRES_PASSWORD: booknasi
          POSTGRES_DB: booknasi
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 3s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10

    env:
      DATABASE_URL: postgres://booknasi:booknasi@localhost:5432/booknasi
      REDIS_URL: redis://localhost:6379/0
      DJANGO_SETTINGS_MODULE: config.settings.local

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync

      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .

      - name: Migrations are complete
        run: uv run python manage.py makemigrations --check --dry-run

      # Named explicitly, ahead of the full suite. These two protect a decision
      # rather than an implementation (core/tests/README.md), and running them
      # by path means deleting either file fails CI with a collection error
      # instead of passing quietly over a smaller suite.
      - name: Load-bearing tests
        run: |
          uv run pytest \
            core/tests/test_tenant_isolation.py \
            core/tests/test_org_scoped_manager_guard.py \
            -v

      - name: Test suite
        run: uv run pytest -q

  tokens:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/packages/tokens
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - name: Build and check design tokens
        run: node src/build.mjs && node src/check.mjs
      - name: dist/ is up to date with tokens.json
        run: git diff --exit-code dist/

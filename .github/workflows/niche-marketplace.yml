name: niche-marketplace

# Workflows only run from `.github/workflows/` at the REPO ROOT, which is why
# this lives here rather than under niche-marketplace/. Path filters keep it
# scoped to the one project in this monorepo.

on:
  push:
    paths:
      - "niche-marketplace/**"
      - ".github/workflows/niche-marketplace.yml"
  pull_request:
    paths:
      - "niche-marketplace/**"
      - ".github/workflows/niche-marketplace.yml"

concurrency:
  group: niche-marketplace-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (ruff · pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: niche-marketplace/backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: marketplace
          POSTGRES_PASSWORD: marketplace
          POSTGRES_DB: marketplace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marketplace"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://marketplace:marketplace@localhost:5432/marketplace
      REDIS_URL: redis://localhost:6379/0
      DJANGO_SECRET_KEY: ci-secret-key
      DJANGO_SETTINGS_MODULE: config.settings.dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: niche-marketplace/backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Check migrations are complete
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: pytest

  frontend:
    name: frontend (lint · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: niche-marketplace/frontend
    env:
      # `next build` sets NODE_ENV=production, and lib/config.ts refuses to fall
      # back to a dev URL in a production build. CI has no deployed API to point
      # at, so pass an explicit placeholder; the real value is set per-environment
      # in the Vercel project.
      NEXT_PUBLIC_API_URL: http://localhost:8000
      API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: niche-marketplace/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  image:
    name: backend image → GHCR
    runs-on: ubuntu-latest
    needs: backend
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/marketplace-backend
          # `main` is what docker-compose.prod.yml pulls by default; the SHA tag
          # is what you pin IMAGE_TAG to for a reproducible rollback.
          tags: |
            type=ref,event=branch
            type=sha,format=long

      # Off main this only builds — it proves the Dockerfile still works
      # without publishing anything.
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: niche-marketplace/backend
          # Runtime deps only — no ruff/pytest on the box.
          target: prod
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
